<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Menú | MyCafé</title>
    <meta
        name="description"
        content="Descubre el menú de MyCafé: cafés, pastelería y opciones para disfrutar."
    >

    <link
        rel="icon"
        type="image/png"
        href="assets/imgs/logocafe.jpg"
    >

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- NAVBAR -->
    <div id="navbar-container"></div>


    <!-- HERO -->
    <section class="hero" aria-labelledby="hero-title">

        <img src="assets/imgs/ph-item-1.jpg" alt="" >

        <div class="hero-overlay" aria-hidden="true"></div>

        <div class="hero-text">
            <h1 id="hero-title">Nuestro Menú</h1>

            <p>
                Explora nuestra carta y encuentra tu próximo
                café favorito o ese antojo que estabas buscando.
            </p>
        </div>

    </section>

    <!-- MENU PDF -->
    <main>
        <section class="menu-pdf" aria-labelledby="menu-title">

            <div class="menu-intro">
                <h2 id="menu-title">Todo lo que tenemos para ti</h2>
            </div>

            <div class="menu-pdf-container">
                <iframe
                    src="assets/otros/menu mycafe.pdf"
                    title="Menú de MyCafé"
                    width="100%"
                    height="750"
                >
                    Tu navegador no puede mostrar el PDF.
                    Puedes abrirlo directamente desde el enlace inferior.
                </iframe>
            </div>

            <div class="menu-pdf-fallback">
                <p>¿No se carga el menú o prefieres verlo por separado?</p>

                <a
                    href="assets/otros/menu mycafe.pdf"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="menu-pdf-button"
                >
                    Abrir menú en PDF ↗
                </a>

                <a
                    href="assets/otros/menu mycafe.pdf"
                    download="Menu-MyCafe.pdf"
                    class="menu-pdf-button"
                >
                    Descargar menú ↓
                </a>
            </div>

        </section>
    </main>


    <!-- FOOTER -->
    <div id="footer-container"></div>

    <script src="script.js"></script>

</body>
</html>
